services:
  db:
    build: ./db
    environment:
      POSTGRES_USER: promptsearch
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: promptsearch
    command: ["postgres", "-c", "shared_preload_libraries=pg_bigm"]
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["prompt-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promptsearch -d promptsearch"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  prompt-data:
